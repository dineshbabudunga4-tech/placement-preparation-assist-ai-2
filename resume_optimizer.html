{% extends "base.html" %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="row">
        <!-- Left Column: Company Selection -->
        <div class="col-md-3">
            <div class="card shadow-sm mb-4">
                <div class="card-header" style="background: #0d6efd; color: white;">
                    <i class="fas fa-building me-2"></i> Select Company
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush" id="companyList">
                        {% for company in companies %}
                        <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center company-item" 
                           onclick="analyzeCompany(event, '{{ company }}')" 
                           data-company="{{ company }}">
                            {{ company }}
                            <i class="fas fa-chevron-right"></i>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header" style="background: #06b6d4; color: white;">
                    <i class="fas fa-chart-bar me-2"></i> Company Comparison
                </div>
                <div class="card-body text-center">
                    <button class="btn btn-primary w-100" onclick="compareCompanies()" id="compareBtn">
                        Compare All Companies
                    </button>
                </div>
            </div>
        </div>

        <!-- Middle Column: Resume Analysis -->
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-header" style="background: #10b981; color: white;">
                    <i class="fas fa-chart-pie me-2"></i> Resume Analysis
                </div>
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center" id="analysisContent">
                    <div class="text-muted mb-3">
                        <i class="fas fa-mouse-pointer fa-3x mb-3"></i>
                        <h5>Select a company to analyze your resume</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Optimized Resume -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-header" style="background: #ef4444; color: white;">
                    <i class="fas fa-file-alt me-2"></i> Optimized Resume
                </div>
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                    <i class="fas fa-edit fa-4x text-muted mb-3"></i>
                    <p class="text-muted">Click "Generate Optimized Resume" to create a company-specific version</p>
                    
                    <button class="btn btn-danger w-100 mt-auto" onclick="generateOptimized()" id="generateBtn" disabled>
                        <i class="fas fa-magic me-2"></i> Generate Optimized Resume
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let selectedCompany = null;

function analyzeCompany(event, company) {
    event.preventDefault();
    
    // Update UI selection
    selectedCompany = company;
    document.querySelectorAll('.company-item').forEach(item => item.classList.remove('active'));
    event.currentTarget.classList.add('active');

    // Show loading in the middle column
    const analysisContent = document.getElementById('analysisContent');
    analysisContent.innerHTML = `
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3">Analyzing resume for ${company}...</p>
    `;

    // Make API call to analyze
    fetch('/analyze_company_resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company: company })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            analysisContent.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        // Build the analysis HTML
        let missingKeywordsHtml = '';
        if (data.missing_keywords && data.missing_keywords[0] !== 'None detected - Great job!') {
            data.missing_keywords.forEach(kw => {
                missingKeywordsHtml += `<span class="badge bg-danger me-1 mb-1">${kw}</span>`;
            });
        } else {
            missingKeywordsHtml = '<span class="text-success">None detected!</span>';
        }

        let suggestionsHtml = '';
        data.suggestions.forEach(sug => {
            suggestionsHtml += `<li>${sug}</li>`;
        });

        analysisContent.innerHTML = `
            <h1 class="display-3 fw-bold mb-0">${data.ats_score}%</h1>
            <p class="text-muted">ATS Match Score</p>
            <hr class="w-100">
            
            <div class="text-start w-100">
                <h6 class="fw-bold">Missing Keywords:</h6>
                <div class="mb-3">${missingKeywordsHtml}</div>
                
                <h6 class="fw-bold">Suggestions:</h6>
                <ul class="ps-3 mb-0" style="color: #cbd5e1;">
                    ${suggestionsHtml}
                </ul>
            </div>
        `;

        // Enable generate button
        document.getElementById('generateBtn').disabled = false;
    })
    .catch(err => {
        console.error(err);
        analysisContent.innerHTML = `<div class="alert alert-danger">Failed to analyze resume.</div>`;
    });
}

function generateOptimized() {
    if (!selectedCompany) return;

    const btn = document.getElementById('generateBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Optimizing...';
    btn.disabled = true;

    fetch('/optimize_company_resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company: selectedCompany })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            btn.innerHTML = originalText;
            btn.disabled = false;
            return;
        }

        alert(data.message);
        // Optional: Redirect to a preview page or display the optimized text
        // window.location.href = '/preview_resume'; 
        btn.innerHTML = '<i class="fas fa-check me-2"></i> Optimized!';
    })
    .catch(err => {
        console.error(err);
        alert('Failed to generate optimized resume.');
        btn.innerHTML = originalText;
        btn.disabled = false;
    });
}

function compareCompanies() {
    const btn = document.getElementById('compareBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Comparing...';
    btn.disabled = true;

    fetch('/compare_resume_companies')
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }

        // Build a comparison table/alert
        let compHtml = '<h5>Company Match Comparison</h5><ul class="list-group mt-3">';
        data.comparisons.forEach(c => {
            compHtml += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <strong>${c.company}</strong>
                    <span class="badge bg-primary rounded-pill">${c.score}%</span>
                </li>
            `;
        });
        compHtml += '</ul>';

        // Show in the analysis column
        document.getElementById('analysisContent').innerHTML = compHtml;
    })
    .catch(err => {
        console.error(err);
        alert('Failed to compare companies.');
    })
    .finally(() => {
        btn.innerHTML = 'Compare All Companies';
        btn.disabled = false;
    });
}
</script>
